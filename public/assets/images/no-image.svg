<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Card Container -->
  <rect x="150" y="150" width="300" height="300" rx="24" fill="#ffffff" filter="url(#subtleShadow)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Centered Image/Picture Icon -->
  <g transform="translate(230, 215)" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="0" y="0" width="140" height="110" rx="16"/>
    <!-- Sun/Lens circle -->
    <circle cx="42" cy="38" r="14" fill="url(#iconGrad)" stroke="none"/>
    <!-- Mountains/landscape -->
    <path d="M12 95 L50 48 L82 82 L102 62 L128 95" stroke-width="8"/>
  </g>

  <!-- Typography -->
  <text x="300" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b" letter-spacing="0.5">
    No Image Available
  </text>
  <text x="300" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Product photo coming soon
  </text>
</svg>
